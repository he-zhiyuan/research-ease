services:
  mysql:
    image: mysql:8
    container_name: researchease-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: researchease
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - researchease-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  researchease-mysql-data:
