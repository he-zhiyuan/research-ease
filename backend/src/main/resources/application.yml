server:
  port: 8080

spring:
  application:
    name: research-ease-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/researchease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: none

researchease:
  jwt:
    secret: ${JWT_SECRET:researchease-mvp-local-dev-secret-key-please-change-in-prod-0001}
    expiration-ms: 86400000
  progress:
    overdue-days: 30

logging:
  level:
    com.researchease: info
