name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Backend test + build
        run: |
          cd backend
          mvn -B test
          mvn -B -DskipTests package

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type-check + build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          timeout 20 ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_OPTS: -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=5 -o ServerAliveCountMax=3
        run: |
          # 跨境链路对本服务器的传输偶发丢包/卡死，用重试代替无限期等待
          retry() {
            local attempt=1
            until timeout 90 "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::命令在 3 次重试后仍然失败: $*"
                return 1
              fi
              echo "第 $attempt 次尝试失败，5 秒后重试: $*"
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry rsync -az --partial -e "ssh $SSH_OPTS" \
            backend/target/research-ease-backend.jar "$SSH_USER@$SSH_HOST:/opt/research-ease/app.jar"
          retry rsync -az --delete --partial -e "ssh $SSH_OPTS" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:/var/www/research-ease/"
          retry ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "systemctl --user restart research-ease"
