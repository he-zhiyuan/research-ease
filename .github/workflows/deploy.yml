name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Backend test + build
        run: |
          cd backend
          mvn -B test
          mvn -B -DskipTests package

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type-check + build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          timeout 20 ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_OPTS: -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=5 -o ServerAliveCountMax=3
        run: |
          timeout 60 scp -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            backend/target/research-ease-backend.jar "$SSH_USER@$SSH_HOST:/opt/research-ease/app.jar"
          timeout 60 rsync -az --delete -e "ssh $SSH_OPTS" frontend/dist/ "$SSH_USER@$SSH_HOST:/var/www/research-ease/"
          timeout 30 ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "systemctl --user restart research-ease"
